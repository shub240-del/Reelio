<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale was pinned to 1 here, which blocks pinch-zoom and is a
      WCAG 1.4.4 failure. Users must be able to scale text.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reelio — AI Video Editing Platform for Creators</title>
    <meta
      name="description"
      content="Reelio is an AI video editing platform that cuts silence, writes captions, finds your best moments and assembles a finished timeline. Upload footage, get a clean edit in minutes." />
    <link rel="canonical" href="https://reelio.app/" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reelio" />
    <meta property="og:title" content="Reelio — AI Video Editing Platform for Creators" />
    <meta
      property="og:description"
      content="Upload footage. Reelio's AI removes dead air, writes captions and builds your timeline. Edit in minutes, not hours." />
    <meta property="og:url" content="https://reelio.app/" />

    <meta name="twitter:title" content="Reelio — AI Video Editing Platform for Creators" />

      name="twitter:description"
      content="Upload footage. Reelio's AI removes dead air, writes captions and builds your timeline." />
